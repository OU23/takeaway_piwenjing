# 数创星光外卖 · nginx 统一入口（容器版，替代 Node 网关 server.js）
server {
    listen 80;
    server_name _;

    # vite-plugin-compression 已生成 .gz，nginx 直接吐预压缩文件，零运行时开销
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 后端 API（compose 网络内服务名 backend）
    location /api/ {
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 无尾斜杠访问统一重定向
    location = /admin    { return 301 /admin/; }
    location = /merchant { return 301 /merchant/; }
    location = /user     { return 301 /user/; }

    # 运营后台 /admin
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri /admin/index.html;
    }

    # 商家端 H5 /merchant
    location /merchant/ {
        alias /usr/share/nginx/html/merchant/;
        try_files $uri /merchant/index.html;
    }

    # 用户端 H5 /user
    location /user/ {
        alias /usr/share/nginx/html/user/;
        try_files $uri /user/index.html;
    }

    # 消费者 H5 /
    location / {
        root /usr/share/nginx/html/consumer;
        try_files $uri /index.html;
    }
}
