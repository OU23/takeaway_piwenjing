# 数创星光外卖 · 前端生产部署（性能向）
# 适用：admin-web / frontend 的 dist 构建物。把 server root 指向各工程 dist/。
# 关键点：哈希文件名 → 静态资源可永久缓存；gzip_static/brotli_static 直接吐构建期预压缩文件。

server {
    listen 443 ssl http2;
    server_name app.xingguang.example.com;

    # 证书（示例，替换为真实证书）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/frontend/dist;
    index index.html;

    # ---- 预压缩资源：优先返回 .br / .gz，避免运行时压缩开销 ----
    brotli_static on;
    gzip_static on;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- 带哈希的构建物：永久缓存 + 不可变，命中率 100% ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri.br $uri.gz =404;
    }

    # ---- SPA 路由回退（运营后台、用户端均为前端路由） ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---- 后端 API 反向代理（可选在此统一收敛 /api，避免跨域） ----
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# CDN 建议：把 /assets/* 整个目录推到 CDN（如 Cloudflare / 阿里云 CDN），
# 源站只回源未被缓存的动态请求；由于文件名带内容哈希，CDN 可放心长缓存。
# 前端 index.html 与 /api 仍走源站或边缘回源，保证版本即时生效。
